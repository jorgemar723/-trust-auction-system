<div class="col">
    <div class="card auction-card border-0 shadow-sm h-100">
        
        <div class="card-img-container">
            <img src="{{ url_for('static', filename=auction.image) }}" 
                 class="card-img-top" 
                 alt="{{ auction.title }}">
        </div>

        <div class="card-body d-flex flex-column">
            <div>
                <small class="text-primary fw-bold text-uppercase auction-lot-id">
                    Lot ID: #{{ auction.id }}
                </small>

                <h5 class="card-title mt-2 mb-1" title="{{ auction.title }}">
                    {{ auction.title }}
                </h5>

                <p class="card-text text-muted small mb-3">
                    {{ auction.description }}
                </p>

                <div class="auction-meta d-flex justify-content-between align-items-center mb-3">
                    <span class="auction-status badge rounded-pill text-bg-success">Open</span>
                    {% if auction.time_remaining == "Ended" %}
                        <small class="text-danger fw-semibold">Ended</small>
                    {% else %}
                        <small class="text-muted">Ends in {{ auction.time_remaining }}</small>
                    {% endif %}
                </div>
            </div>

            <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-end">
                <div>
                    <small class="d-block text-muted auction-label">Current Bid</small>
                    <span class="h5 fw-bold mb-0 text-dark">{{ auction.current_bid }} ETH</span>
                </div>

                <a href="/auction/{{ auction.id }}" class="btn btn-trust px-3">
                    View Auction
                </a>
            </div>
        </div>

    </div>
</div>
