{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>My Auctions</h2>
    {% if auctions %}
    <div class="row">
        {% for auction in auctions %}
        <div class="col-md-4 mb-4">
            {% include "auction_card.html" %}
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p>You haven't created any auctions yet.</p>
    <a href="{{ url_for('create_auction') }}" class="btn btn-success">Create Auction</a>
    {% endif %}
</div>
{% endblock %}
