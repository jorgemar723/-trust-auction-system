{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Create New Auction</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('auction_create.create_auction') }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="starting_bid" class="form-label">Starting Bid (ETH)</label>
                        <input type="number" step="0.01" class="form-control" id="starting_bid" name="starting_bid" required>
                    </div>
                    <div class="mb-3">
                        <label for="expires_at" class="form-label">Expiration Date</label>
                        <input type="datetime-local" class="form-control" id="expires_at" name="expires_at" required>
                    </div>
                    <div class="mb-3">
                        <label for="images" class="form-label">Item Images</label>
                        <input type="file" class="form-control" id="images" name="images" accept="image/*" multiple required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create Auction</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
